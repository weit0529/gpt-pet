<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GPT娘 · Codex Mini</title>
<style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#eee9fa;background:#181521}*{box-sizing:border-box}body{margin:0;padding:40px;max-width:1200px;margin:auto}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:32px;margin:0}p{color:#bdb2cd;line-height:1.8}small{color:#b8a8ca}.pill{border:1px solid #665775;border-radius:30px;padding:8px 16px;color:#d9c2fa}.layout{display:grid;grid-template-columns:1fr 280px;gap:24px;margin-top:28px}#stage{height:530px;position:relative;border:1px solid #51435d;border-radius:24px;overflow:hidden;background:radial-gradient(ellipse at 50% 85%,#54426b,#252032 65%);touch-action:none}#pet{position:absolute;left:calc(50% - 96px);top:180px;width:192px;height:208px;background-image:url('spritesheet.webp');background-size:1536px 2288px;cursor:grab;touch-action:none;user-select:none;filter:drop-shadow(0 12px 18px #120e2460)}#pet:active{cursor:grabbing}#hint{position:absolute;bottom:24px;text-align:center;width:100%;color:#cfbfdc;font-size:14px}aside{background:#252031;border-radius:24px;padding:22px}button{font:inherit;display:block;width:100%;border:1px solid #50425c;background:#30283e;color:#d5c8e5;border-radius:10px;padding:10px 14px;text-align:left;margin:7px 0;cursor:pointer}button.active,button:hover{background:#705287;color:#fff;border-color:#b699d0}label{display:block;font-size:14px;margin:18px 0;color:#c9bbd7}#status{position:absolute;top:24px;left:24px;color:#ddc8f3}.note{font-size:13px}a{color:#cdb0f0}#stage.light{background:#efe9f4}footer{margin-top:24px}@media(max-width:750px){body{padding:20px}.layout{grid-template-columns:1fr}#stage{height:430px}aside{display:flex;flex-wrap:wrap;gap:5px}button{width:auto}h1{font-size:24px}}</style>
<header><div><h1>GPT 娘</h1><p>白发紫瞳的小龙娘，陪你一起把事情做好。</p></div><span class="pill">CODEX MINI · V2</span></header>
<div class="layout"><div id="stage"><span id="status">待机</span><div id="pet" role="img" aria-label="GPT娘动画，拖动左右奔跑，悬停站立微笑招手"></div><div id="hint">移到她身上微笑招手 · 按住左右拖动奔跑</div></div><aside><div id="buttons"></div><label><input type="checkbox" id="follow"> 跟随鼠标 · 16 方向</label><label><input type="checkbox" id="light"> 浅色背景</label><label><input type="checkbox" id="slow"> 慢速检查动作</label></aside></div>
<footer><p class="note">预览使用最终 WebP 的真实帧及官方帧时长。此页为本地交互演示，未接入真实命令事件。原生 Codex 将执行与思考共同映射为 running，所以工作动画现为完整的 6 帧连续敲键盘。开启鼠标跟随后，待机／工作／挥手会显示对应视角；悬停与拖动优先播放动作。</p><a href="docs/images/contact-sheet.jpg">查看全部帧</a> · <a href="docs/SECURITY-AUDIT.md">隐私与安全检查</a></footer>
<script>
const names=['idle','running-right','running-left','waving','jumping','failed','waiting','running','review'];const labels=['待机 · 眨眼与呼吸','右跑 · 右向拖动','左跑 · 左向拖动','挥手 · 亲切招呼','悬停 · 微笑招手','受阻 · 鼓劲重试','等待 · 请你回应','工作 · 连续敲键盘','完成 · 拍手点赞'];const counts=[6,8,8,4,5,8,6,6,6];const times=[[1680,660,660,840,840,1920],[120,120,120,120,120,120,120,220],[120,120,120,120,120,120,120,220],[140,140,140,280],[140,140,140,140,280],[140,140,140,140,140,140,140,240],[150,150,150,150,150,260],[120,120,120,120,120,220],[150,150,150,150,150,280]];
const pet=document.querySelector('#pet'),stage=document.querySelector('#stage'),status=document.querySelector('#status');let chosen=0,row=0,frame=0,next=0,hover=false,drag=false,lastX=0,look=null,offsetX=0,offsetY=0;
function cell(r,c){pet.style.backgroundPosition=`${-c*192}px ${-r*208}px`}
function state(r){if(row!==r){row=r;frame=0;next=0}status.textContent=labels[r]}
names.forEach((name,i)=>{const b=document.createElement('button');b.textContent=labels[i];b.onclick=()=>{chosen=i;look=null;state(i);document.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active')};if(!i)b.classList.add('active');document.querySelector('#buttons').append(b)});
pet.onpointerenter=()=>{hover=true;if(!drag)state(4)};pet.onpointerleave=()=>{hover=false;if(!drag)state(chosen)};
pet.onpointerdown=e=>{drag=true;lastX=e.clientX;const r=pet.getBoundingClientRect();offsetX=e.clientX-r.left;offsetY=e.clientY-r.top;pet.setPointerCapture(e.pointerId)};
pet.onpointermove=e=>{if(!drag)return;const dx=e.clientX-lastX;if(Math.abs(dx)>=4){state(dx>0?1:2);lastX=e.clientX}const r=stage.getBoundingClientRect();pet.style.left=Math.max(0,Math.min(r.width-192,e.clientX-r.left-offsetX))+'px';pet.style.top=Math.max(0,Math.min(r.height-208,e.clientY-r.top-offsetY))+'px'};
function release(e){drag=false;pet.releasePointerCapture?.(e.pointerId);const r=pet.getBoundingClientRect();hover=e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom;state(hover?4:chosen)}pet.onpointerup=release;pet.onpointercancel=release;
document.onpointermove=e=>{const r=pet.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2;look=Math.hypot(dx,dy)>1?Math.round(((Math.atan2(dx,-dy)*180/Math.PI+360)%360)/22.5)%16:null};
document.querySelector('#light').onchange=e=>stage.classList.toggle('light',e.target.checked);
document.querySelector('#follow').onchange=()=>{status.textContent=labels[row];next=0};
function tick(t){if(!drag&&!hover&&[0,3,7].includes(row)&&document.querySelector('#follow').checked&&look!==null){cell(9+Math.floor(look/8),look%8);status.textContent='鼠标方向 · '+look*22.5+'°'}else if(t>=next){cell(row,frame);next=t+times[row][frame]*(document.querySelector('#slow').checked?2:1);frame=(frame+1)%counts[row]}requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></html>
